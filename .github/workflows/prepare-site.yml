name: Prepare NatureWorks site
on:
  push:
    branches: [main]
    paths:
      - "mg-natureworks-site.zip"
      - ".github/workflows/prepare-site.yml"

permissions:
  contents: write

jobs:
  extract-site:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true

      - name: Extract and clean the website
        shell: bash
        run: |
          set -euo pipefail
          test -f mg-natureworks-site.zip
          mkdir .site-extract
          unzip -q mg-natureworks-site.zip -d .site-extract
          cp -a .site-extract/. .
          rm -rf .site-extract source-videos
          rm -f mg-natureworks-site.zip
          find . -type f \( -iname '*.mp4' -o -iname '*.mov' -o -iname '*.m4v' -o -name '.DS_Store' \) -delete
          find . -type d -name '__MACOSX' -prune -exec rm -rf {} +
          cat > README.md <<'EOF'
          # M&G NatureWorks International Research Institute

          Static website built with HTML, CSS and JavaScript. No package install or build step is required; Vercel serves `index.html` from the repository root.

          ## Project structure
          - `index.html` — page markup
          - `css/styles.css` — styling and responsive layouts
          - `js/` — interactions, frame sequences, gallery and product cards
          - `assets/images/` — logo, product and community imagery
          - `assets/frames/` — optimized JPG sequences used by the scroll animations

          ## Run locally
          Run `python3 -m http.server 8000` from the repository root and open `http://localhost:8000`.

          ## Before public launch
          - Replace demo testimonials and profiles with genuine, consented testimonials.
          - Verify all historical dates, founder biographies and product descriptions.
          - Obtain regulatory/legal review for health or treatment claims; do not present products as proven cures without appropriate evidence and authorization.
          - Confirm contact details, WhatsApp destination and form behavior.
          - Replace generated-looking portraits/product imagery with approved real assets where available.

          The original source-video files are excluded from the deployed repository; the JPG frame sequences are retained.
          EOF
          test -f index.html
          test -d assets/frames
          test -d css
          test -d js

      - name: Commit extracted website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Extract and prepare NatureWorks website [skip ci]"
            git push
          fi
